<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.4"/>
  
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clipboard body -->
    <rect x="140" y="155" width="232" height="270" rx="24"/>
    
    <!-- Clipboard clip tab -->
    <rect x="210" y="130" width="92" height="50" rx="16"/>
    
    <!-- Document lines -->
    <line x1="180" y1="230" x2="332" y2="230" stroke-width="24" opacity="0.6"/>
    <line x1="180" y1="290" x2="332" y2="290" stroke-width="24" opacity="0.6"/>
    <line x1="180" y1="350" x2="280" y2="350" stroke-width="24" opacity="0.6"/>
  </g>
</svg>
