                                addAGrupo(familiar, detalle ? `${item.label} (${detalle})` : item.label);
                            } else if (status === 'niega') {
                                denies.push(item.label);
                            }
                        });
                        let otrosLista = getNestedValue(formData, `${basePath}.otros_lista`, []);
                        if (!Array.isArray(otrosLista)) otrosLista = [];
                        otrosLista.forEach(o => {
                            if (o && o.texto) addAGrupo(o.familiar, o.texto);
                        });

                        const famKeys = Object.keys(grupos);
                        if (famKeys.length === 0 && denies.length === 0) return;

                        if (famKeys.length > 0) {
                            const frasesFam = famKeys.map(fam => {
                                const enfe = grupos[fam];
                                const ultima = enfe.pop();
                                const textoEnfe = enfe.length > 0 ? enfe.join(', ') + ' y ' + ultima : ultima;
                                return `su ${fam} padece de ${textoEnfe}`;
                            });
                            const ultimaFrase = frasesFam.pop();
                            const textoFam = frasesFam.length > 0 ? frasesFam.join(', ') + ' y ' + ultimaFrase : ultimaFrase;
                            narrative += `El paciente refiere que ${textoFam}. `;
                        }

                        if (denies.length > 0) {
                            const ultima = denies.pop();
                            const textoDenies = denies.length > 0 ? denies.join(', ') + ' y ' + ultima : ultima;
                            narrative += `Por otro lado, niega la presencia de antecedentes familiares correspondientes a ${textoDenies}. `;
                        }
                    } else {
                        items.forEach(item => {
                            const status = getVal(`${basePath}.${item.id}.status`);
                            const detalle = getVal(`${basePath}.${item.id}.detalle`);
                            if (status === 'refiere') {
                                refers.push(detalle ? `${item.label} (${detalle})` : item.label);
                            } else if (status === 'niega') {
                                denies.push(item.label);
                            }
                        });
                        const otrosTexto = getVal(`${basePath}.otros_texto`);

                        if (refers.length === 0 && denies.length === 0 && !otrosTexto) return;

                        if (refers.length > 0) {
                            const ultima = refers.pop();
                            const textoRefers = refers.length > 0 ? refers.join(', ') + ' y ' + ultima : ultima;
                            narrative += `El paciente refiere antecedente de ${textoRefers}. `;
                        } else if (denies.length > 0 || otrosTexto) {
                            narrative += `El paciente no refiere antecedentes o complicaciones patológicas particulares en esta área. `;
                        }

                        if (denies.length > 0) {
                            const ultima = denies.pop();
                            const textoDenies = denies.length > 0 ? denies.join(', ') + ' y ' + ultima : ultima;
                            narrative += `Niega tener o haber tenido ${textoDenies}. `;
                        }

                        if (otrosTexto) {
                            narrative += `Adicionalmente, reporta: ${otrosTexto}.`;
                        }
                    }

                    if (narrative.trim() === '') return;
                    htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase;">${title}</h2>`;
                    htmlContent += `<div style="text-align: justify; margin-bottom: 10px; line-height: 1.5;">${narrative.trim()}</div>`;
                };

                buildNiegaRefiereHtml('Antecedentes Personales Patológicos', ANTECEDENTES_PATOLOGICOS, 'antecedentes_patologicos');
                buildNiegaRefiereHtml('Antecedentes Quirúrgicos / Traumáticos / Transfusionales', ANTECEDENTES_QUIRURGICOS, 'antecedentes_quirurgicos');

                addTextSection('Medicamentos de Uso Actual', 'antecedentes_farmacologicos.medicamentos_actuales');
                addTextSection('Alergias Medicamentosas Conocidas', 'antecedentes_farmacologicos.alergias_medicamentosas');

                // Gineco-obstétricos y Desarrollo psicomotor
                const addStructuredSection = (title, config, basePath) => {
                    const values = getNestedValue(formData, basePath, {});
                    const composed = config.compose(values);
                    const notas = getVal(`${basePath}.notas`);
                    if (!composed && !notas) return;
                    htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase;">${title}</h2>`;
                    if (composed) htmlContent += `<div style="margin-bottom:4px; text-align: justify; line-height: 1.5;">${composed}</div>`;
                    if (notas) htmlContent += `<div style="color:#4b5563; font-style: italic; text-align: justify; line-height: 1.5;">${notas}</div>`;
                };

                                                // --- CUSTOM FAMILY HISTORY SECTION ---
                const famDirValues = getNestedValue(formData, 'familia_directa', {});
                const famNotas = famDirValues.notas;
                
                const gruposFam = {};
                const addAFam = (familiarRaw, texto) => {
                    const familiar = familiarRaw || 'un familiar no especificado';
                    const norm = familiar.toLowerCase();
                    if (!gruposFam[norm]) gruposFam[norm] = [];
                    gruposFam[norm].push(texto);
                };
                let famDenies = [];
                ANTECEDENTES_FAMILIARES.forEach(item => {
                    const status = getVal(`antecedentes_familiares.${item.id}.status`);
                    const detalle = getVal(`antecedentes_familiares.${item.id}.detalle`);
                    const familiar = getVal(`antecedentes_familiares.${item.id}.familiar`);
                    if (status === 'refiere') {
                        addAFam(familiar, detalle ? `${item.label} (${detalle})` : item.label);
                    } else if (status === 'niega') {
                        famDenies.push(item.label);
                    }
                });
                let otrosFamLista = getNestedValue(formData, 'antecedentes_familiares.otros_lista', []);
                if (!Array.isArray(otrosFamLista)) otrosFamLista = [];
                otrosFamLista.forEach(o => {
                    if (o && o.texto) addAFam(o.familiar, o.texto);
                });

                const getEnfeText = (normKey) => {
                    if (!gruposFam[normKey] || gruposFam[normKey].length === 0) return '';
                    const enfe = [...gruposFam[normKey]];
                    const ultima = enfe.pop();
                    return enfe.length > 0 ? enfe.join(', ') + ' y ' + ultima : ultima;
                };

                const parts = [];
                // Padre
                if (famDirValues.padre_estado === 'Vivo') {
                    let txt = famDirValues.padre_edad ? `Padre de ${famDirValues.padre_edad} años` : `Padre vivo`;
                    const enf = getEnfeText('padre');
                    if (enf) txt += ` con ${enf}`;
                    else if (famDirValues.padre_salud) txt += `, ${(famDirValues.padre_salud || '').toLowerCase().replace(' (ver antecedentes abajo)', '')}`;
                    parts.push(txt);
                    delete gruposFam['padre'];
                } else if (famDirValues.padre_estado === 'Fallecido') {
                    let txt = `Padre fallecido${famDirValues.padre_edad_fallecio ? ` a los ${famDirValues.padre_edad_fallecio} años` : ''}${famDirValues.padre_causa ? `, causa: ${famDirValues.padre_causa}` : ''}`;
                    const enf = getEnfeText('padre');
                    if (enf) txt += ` (padecía de ${enf})`;
                    parts.push(txt);
                    delete gruposFam['padre'];
                }

                // Madre
                if (famDirValues.madre_estado === 'Viva') {
                    let txt = famDirValues.madre_edad ? `Madre de ${famDirValues.madre_edad} años` : `Madre viva`;
                    const enf = getEnfeText('madre');
                    if (enf) txt += ` con ${enf}`;
                    else if (famDirValues.madre_salud) txt += `, ${(famDirValues.madre_salud || '').toLowerCase().replace(' (ver antecedentes abajo)', '')}`;
                    parts.push(txt);
                    delete gruposFam['madre'];
                } else if (famDirValues.madre_estado === 'Fallecida') {

                    let txt = `Madre fallecida${famDirValues.madre_edad_fallecio ? ` a los ${famDirValues.madre_edad_fallecio} años` : ''}${famDirValues.madre_causa ? `, causa: ${famDirValues.madre_causa}` : ''}`;
                    const enf = getEnfeText('madre');
                    if (enf) txt += ` (padecía de ${enf})`;
                    parts.push(txt);
                    delete gruposFam['madre'];
                }

                // Hermanos
                if (famDirValues.num_hermanos > 0) {
                    let hTxt = `${famDirValues.num_hermanos} hermano(s)`;
                    let hDesc = [];
                    if (famDirValues.hermanos_vivos > 0) {
                        const enf = getEnfeText('hermanos') || getEnfeText('hermano');
                        if (enf) hDesc.push(`${famDirValues.hermanos_vivos} vivo(s) con ${enf}`);
                        else hDesc.push(`${famDirValues.hermanos_vivos} vivo(s) (${(famDirValues.hermanos_salud || '').toLowerCase().replace(' (ver antecedentes abajo)', '')})`);
                        delete gruposFam['hermanos']; delete gruposFam['hermano'];
                    }
                    if (famDirValues.hermanos_fallecidos > 0) hDesc.push(`${famDirValues.hermanos_fallecidos} fallecido(s)${famDirValues.hermanos_causa ? ` (causa: ${famDirValues.hermanos_causa})` : ''}`);
                    if (hDesc.length > 0) hTxt += `: ${hDesc.join(', ')}`;
                    parts.push(hTxt);
                }

                // Cónyuge
                if (famDirValues.conyuge_estado && famDirValues.conyuge_estado !== 'No aplica') {
                    const enf = getEnfeText('cónyuge') || getEnfeText('pareja') || getEnfeText('esposo') || getEnfeText('esposa');
                    let txt = `Cónyuge: ${(famDirValues.conyuge_estado || '').toLowerCase()}`;
                    if (enf) txt += ` con ${enf}`;
                    parts.push(txt);
                    delete gruposFam['cónyuge']; delete gruposFam['pareja']; delete gruposFam['esposo']; delete gruposFam['esposa'];
                }

                // Hijos
                if (famDirValues.hijos_num > 0) {
                    let txt = `${famDirValues.hijos_num} hijo(s)`;
                    const enf = getEnfeText('hijos') || getEnfeText('hijo') || getEnfeText('hija') || getEnfeText('hijas');
                    if (enf) txt += ` con ${enf}`;
                    else txt += `, ${(famDirValues.hijos_salud || '').toLowerCase().replace(' (ver antecedentes abajo)', '')}`;
                    parts.push(txt);
                    delete gruposFam['hijos']; delete gruposFam['hijo']; delete gruposFam['hija']; delete gruposFam['hijas'];
                }
                
                let combinedText = '';
                if (parts.length > 0) {
                    combinedText += `El núcleo familiar directo está compuesto por: ${parts.join('. ')}. `;
                }

                // Resto de familiares que no matchearon arriba
                const famKeys = Object.keys(gruposFam);
                if (famKeys.length > 0) {
                    const frasesFam = famKeys.map(fam => {
                        const enfe = gruposFam[fam];
                        const ultima = enfe.pop();
                        const textoEnfe = enfe.length > 0 ? enfe.join(', ') + ' y ' + ultima : ultima;
                        return `su ${fam} padece de ${textoEnfe}`;
                    });
                    const ultimaFrase = frasesFam.pop();
                    const textoFam = frasesFam.length > 0 ? frasesFam.join('; ') + '; y ' + ultimaFrase : ultimaFrase;
                    combinedText += `Además, refiere que ${textoFam}. `;
                }

                if (famDenies.length > 0) {
                    const ultima = famDenies.pop();
                    const textoDenies = famDenies.length > 0 ? famDenies.join(', ') + ' y ' + ultima : ultima;
                    combinedText += `Niega antecedentes patológicos familiares de ${textoDenies}. `;
                }

                if (famNotas) {
                    combinedText += `Notas adicionales: ${famNotas}`;
                }

                if (combinedText.trim()) {
                    htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase;">Composición y Antecedentes Familiares</h2>`;
                    htmlContent += `<div style="margin-bottom:4px; text-align: justify; line-height: 1.5;">${combinedText}</div>`;
                }
                // --- END CUSTOM FAMILY HISTORY SECTION ---



                addStructuredSection('Esquema de Vacunación', VACUNACION_CONFIG, 'vacunacion');
                addStructuredSection('Antecedentes Gineco-Obstétricos', GINECO_CONFIG, 'gineco');
                addStructuredSection('Antecedentes Prenatales y Obstétricos (del paciente)', PRENATAL_PACIENTE_CONFIG, 'prenatal_paciente');
                addStructuredSection('Periodo Neonatal', PERIODO_NEONATAL_CONFIG, 'periodo_neonatal');
                addStructuredSection('Alimentación Infantil', ALIMENTACION_INFANTIL_CONFIG, 'alimentacion_infantil');
                addStructuredSection('Desarrollo Psicomotor', DESARROLLO_CONFIG, 'desarrollo');

                // Hábitos psicobiológicos
                let habitosHtml = '';
                Object.keys(HABITOS_CONFIG).forEach(key => {
                    const cfg = HABITOS_CONFIG[key];
                    const values = getNestedValue(formData, `habitos.${key}`, {});
                    const composed = cfg.compose(values);
                    const notas = values.notas;
                    if (composed || notas) {
                        habitosHtml += `<li style="margin-bottom:4px; line-height: 1.5;"><strong style="color:#374151;">${cfg.title}:</strong> ${composed || ''}${notas ? ` <em style="color:#6b7280;">(${notas})</em>` : ''}</li>`;
                    }
                });
                if (habitosHtml) {
                    htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase;">Hábitos Psicobiológicos</h2>`;
                    htmlContent += `<ul style="margin:0; padding-left:16px;">${habitosHtml}</ul>`;
                }

                addStructuredSection('Antecedentes Epidemiológicos y Socioambientales', EPIDEMIOLOGICOS_CONFIG, 'epidemiologicos');

                // 5. GENERADOR DE SISTEMAS FORMATO NARRATIVO
                const buildSystemsHtml = (title, templateObj, statePath) => {
                    let sectionHtml = '';
                    let hasContent = false;

                    Object.keys(templateObj).forEach(groupKey => {
                        let groupNarrative = [];
                        let hasIssues = false;
                        
                        templateObj[groupKey].forEach(item => {
                            const status = getVal(`${statePath}.${groupKey}.${item.id}.status`, 'omit');
                            const text = getVal(`${statePath}.${groupKey}.${item.id}.text`, '');

                            if (status !== 'omit' && text.trim() !== '') {
                                groupNarrative.push(`${item.label.toLowerCase()} (${text})`);
                                if (status === 'pathological') hasIssues = true;
                            }
                        });

                        const otrosHallazgos = getVal(`${statePath}.${groupKey}.otros_hallazgos`);
                        if (otrosHallazgos) {
                            groupNarrative.push(`otros hallazgos asociados: ${otrosHallazgos}`);
                            hasIssues = true;
                        }

                        if (groupNarrative.length > 0) {
                            hasContent = true;
                            const groupName = groupKey.replace(/_/g, ' ').toUpperCase();
                            
                            let narrativeText = "";
                            const ultima = groupNarrative.pop();
                            const textoItems = groupNarrative.length > 0 ? groupNarrative.join(', ') + ' y ' + ultima : ultima;

                            if (hasIssues) {
                                narrativeText = `A nivel de ${groupName.toLowerCase()}, se evidencian alteraciones o descripciones patológicas consistentes en ${textoItems}.`;
                            } else {
                                narrativeText = `El interrogatorio / examen de ${groupName.toLowerCase()} muestra normalidad o descripción clínica de ${textoItems}.`;
                            }

                            sectionHtml += `<div style="margin-bottom: 6px; text-align: justify; line-height: 1.5;">
                                <strong style="color: #1f2937;">${groupName}:</strong> ${narrativeText}
                            </div>`;
                        }
                    });

                    if (hasContent) {
                        htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 8px; padding-bottom: 2px; text-transform: uppercase;">${title}</h2>`;
                        htmlContent += sectionHtml;
                    }
                };

                buildSystemsHtml('Examen Funcional', EXAMEN_FUNCIONAL_TEMPLATE, 'examen_funcional');

                // 6. SIGNOS VITALES
                let vitalsHtml = '';
                const vitals = [
                    {label: 'TA', path: 'vitales.ta', unit: 'mmHg'}, {label: 'FC', path: 'vitales.fc', unit: 'lpm'},
                    {label: 'FR', path: 'vitales.fr', unit: 'rpm'}, {label: 'Temp', path: 'vitales.temp', unit: '°C'},
                    {label: 'SatO2', path: 'vitales.sat', unit: '%'}, {label: 'Peso', path: 'vitales.peso', unit: 'kg'},
                    {label: 'Talla', path: 'vitales.talla', unit: 'cm'}, {label: 'IMC', path: 'vitales.imc', unit: ''},
                    {label: 'Circunf. Cintura', path: 'vitales.cintura', unit: 'cm'}, {label: 'Circunf. Cadera', path: 'vitales.cadera', unit: 'cm'},
                    {label: 'Índice Cintura/Cadera', path: 'vitales.icc', unit: ''}, {label: 'Perímetro Cefálico', path: 'vitales.perimetro_cefalico', unit: 'cm'},
                    {label: 'Glicemia capilar', path: 'vitales.glicemia', unit: 'mg/dL'}, {label: 'Escala de dolor', path: 'vitales.dolor', unit: '/10'}
                ];

                vitals.forEach(v => {
                    const val = getVal(v.path);
                    if(val) vitalsHtml += `<span style="border: 1px solid #e4f2d6; padding: 2px 6px; margin-right: 6px; margin-bottom: 6px; display: inline-block;"><strong>${v.label}:</strong> ${val} ${v.unit}</span> `;
                });

                if (vitalsHtml) {
                     htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 8px; padding-bottom: 2px; text-transform: uppercase;">Signos Vitales y Antropometría</h2>`;
                     htmlContent += `<div style="line-height: 2;">${vitalsHtml}</div>`;
                }

                buildSystemsHtml('Examen Físico', EXAMEN_FISICO_TEMPLATE, 'examen_fisico');

                addTextSection('Impresión Diagnóstica (tras antecedentes y examen físico)', 'diagnostico.impresion');
                addTextSection('Plan / Órdenes Médicas', 'diagnostico.plan');

                // 7. EVOLUCIÓN
                const evolRows = getNestedValue(formData, 'evolucion.notas', []);
                if (Array.isArray(evolRows) && evolRows.some(r => r.nota && r.nota.trim())) {
                    htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase;">Notas de Evolución</h2>`;
                    htmlContent += `<table style="width:100%; border-collapse: collapse; margin-bottom: 10px;"><tr><td style="border:1px solid #e5e7eb; padding:4px; font-weight:bold; width:15%;">Fecha</td><td style="border:1px solid #e5e7eb; padding:4px; font-weight:bold; width:10%;">Hora</td><td style="border:1px solid #e5e7eb; padding:4px; font-weight:bold;">Nota</td></tr>`;
                    evolRows.forEach(r => {
                        if (r.nota && r.nota.trim()) {
                            htmlContent += `<tr><td style="border:1px solid #e5e7eb; padding:4px;">${r.fecha || ''}</td><td style="border:1px solid #e5e7eb; padding:4px;">${r.hora || ''}</td><td style="border:1px solid #e5e7eb; padding:4px;">${r.nota}</td></tr>`;
                        }
                    });
                    htmlContent += `</table>`;
                }

                // 8. EGRESO
                const egresoVal = getVal('egreso.tipo');
                if (egresoVal || getVal('egreso.diagnostico_final')) {
                    htmlContent += `<h2 style="font-size: 12px; font-weight: bold; color: #567d25; border-bottom: 1px solid #e5e7eb; margin-top: 12px; margin-bottom: 5px; padding-bottom: 2px; text-transform: uppercase;">Egreso</h2>`;
                    htmlContent += `<div style="margin-bottom:4px;">`;
                    if (egresoVal) htmlContent += `<strong>Tipo de egreso:</strong> ${egresoVal}. `;
                    if (getVal('egreso.fecha')) htmlContent += `<strong>Fecha:</strong> ${getVal('egreso.fecha')} ${getVal('egreso.hora') || ''}. `;
                    htmlContent += `</div>`;
                    if (getVal('egreso.diagnostico_final')) htmlContent += `<div><strong>Diagnóstico Clínico Final:</strong> ${getVal('egreso.diagnostico_final')}</div>`;
                    if (getVal('egreso.autopsia')) htmlContent += `<div style="margin-top:4px;"><strong>Autopsia solicitada:</strong> ${getVal('egreso.autopsia')}</div>`;
                    if (getVal('egreso.exoneracion_nombre')) {
                        htmlContent += `<div style="margin-top:8px; padding:8px; border:1px solid #fbbf24; border-radius:6px;">
                            <strong style="color:#92400e;">Exoneración de Responsabilidad por Egreso:</strong>
                            Firmado por ${getVal('egreso.exoneracion_nombre')} (C.I. ${getVal('egreso.exoneracion_cedula') || '___'}) — Parentesco: ${getVal('egreso.exoneracion_parentesco') || '___'} — Fecha: ${getVal('egreso.exoneracion_fecha') || '___'}
                        </div>`;
                    }
                }

                htmlContent += `</div>`;

                // Construcción de documento Word (.doc compatible usando MIME HTML)
                const docHeader = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Historia Clinica</title></head><body>";
                const docFooter = "</body></html>";
                const sourceHTML = docHeader + htmlContent + docFooter;
                
                const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const fileDownload = document.createElement("a");
                document.body.appendChild(fileDownload);
                fileDownload.href = url;
                fileDownload.download = `Historia_Clinica_${getVal('id.apellidos', 'Paciente')}_${getVal('id.nombres', '')}.doc`;
                fileDownload.click();
                document.body.removeChild(fileDownload);
                URL.revokeObjectURL(url);
            };


            if (!isLoaded) return <div className="flex h-screen items-center justify-center text-clinical-600 font-medium">Cargando Historia Clínica...</div>;

            const progressPercentage = ((currentStep + 1) / SECTIONS.length) * 100;

            return (
                <>
                {view === 'list' ? (
                    <RecordsListView records={recordIndex} onOpen={openRecord} onNew={startNewRecord} onDelete={requestDeleteRecord} isOnline={isOnline} />
                ) : (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    <header className="bg-clinical-900/90 backdrop-blur-xl text-white shadow-[0_4px_30px_rgba(0,0,0,0.08)] sticky top-0 z-20 border-b border-clinical-800">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
                            <div className="flex items-center gap-1 sm:gap-3 min-w-0">
                                <button onClick={backToList} className="p-2 hover:bg-white/10 rounded-full transition-colors flex-shrink-0" title="Volver a Mis Historias">
                                    <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                </button>
                                <div className="flex flex-col min-w-0">
                                    <h1 className="text-lg sm:text-2xl font-extrabold tracking-tight leading-tight truncate">Historia Clínica</h1>
                                    <span className="text-[10px] sm:text-xs font-semibold text-clinical-200 opacity-90 mt-0.5 tracking-wider uppercase truncate">
                                        por Luis A. Medina Franco
                                    </span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={requestClearCurrent} className="px-3 sm:px-4 py-2 bg-white/10 hover:bg-red-500 rounded-full transition-all flex items-center text-sm font-bold ring-1 ring-white/20" title="Vaciar esta historia">
                                    <svg className="w-4 h-4 mr-0 sm:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    <span className="hidden sm:inline">Limpiar</span>
                                </button>
                                <button onClick={exportWordDocument} className="px-4 sm:px-5 py-2 bg-white text-clinical-900 hover:bg-clinical-50 rounded-full shadow-[0_2px_10px_rgba(0,0,0,0.1)] transition-all flex items-center text-sm font-bold" title="Exportar a Word (editable)">
                                    <svg className="w-4 h-4 mr-0 sm:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    <span className="hidden sm:inline">Word</span>
                                </button>
                            </div>
                        </div>

                        <div className="max-w-4xl mx-auto px-4 pb-0 overflow-x-auto tab-scrollbar flex gap-4 mt-2">
                            {SECTIONS.map((section, index) => (
                                <button
                                    key={index}
                                    onClick={() => changeStep(index)}
                                    className={`whitespace-nowrap px-2 py-3 text-sm font-bold border-b-2 transition-all duration-200 ${currentStep === index ? 'border-white text-white' : 'border-transparent text-clinical-200/80 hover:text-white'}`}
                                >
                                    {section}
                                </button>
                            ))}
                        </div>
                        <div className="h-0.5 bg-clinical-900/50 w-full mt-[1px]">
                            <div className="h-0.5 bg-clinical-400 transition-all duration-500 ease-out shadow-[0_0_8px_rgba(255,255,255,0.5)]" style={{ width: `${progressPercentage}%` }}></div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 pb-24">
                        <div className="bg-white/80 backdrop-blur-xl rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-5 sm:p-7 mb-6 min-h-[50vh] p-5 sm:p-7 mb-6 min-h-[50vh]">
                            <h2 className="text-xl font-extrabold text-gray-800 mb-6 pb-3 border-b-2 border-clinical-200 uppercase tracking-wider flex items-center gap-3">
                                <span className="w-1 h-6 bg-gradient-to-b from-clinical-500 to-clinical-700 rounded-full"></span>
                                {SECTIONS[currentStep]}
                            </h2>

                            <div className="animate-fade-in">
                                {currentStep === 0 && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                            <InputText label="Historia No." path="id.numero" value={getVal('id.numero')} onChange={handleUpdate} />
                                            <InputText label="F. Ingreso" type="date" path="id.fecha" value={getVal('id.fecha')} onChange={handleUpdate} />
                                            <InputText label="Hora de Ingreso" type="time" path="id.hora_ingreso" value={getVal('id.hora_ingreso')} onChange={handleUpdate} />
                                            <SelectInput label="Tipo de Ingreso" path="id.tipo_ingreso" options={['Consulta', 'Emergencia', 'Referido']} value={getVal('id.tipo_ingreso')} onChange={handleUpdate} />
                                            <InputText label="Servicio" path="id.servicio" value={getVal('id.servicio')} onChange={handleUpdate} />
                                        </div>
                                        <InputText label="Sala / Cuarto / Cama" path="id.sala" value={getVal('id.sala')} onChange={handleUpdate} />
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <InputText label="Apellidos" path="id.apellidos" value={getVal('id.apellidos')} onChange={handleUpdate} />
                                            <InputText label="Nombres" path="id.nombres" value={getVal('id.nombres')} onChange={handleUpdate} />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                            <InputText label="Cédula" path="id.cedula" value={getVal('id.cedula')} onChange={handleUpdate} />
                                            <InputText label="Fecha de Nacimiento" type="date" path="id.fecha_nacimiento" value={getVal('id.fecha_nacimiento')} onChange={handleUpdate} />
                                            <InputText label="Hora de Nacimiento" type="time" path="id.hora_nacimiento" value={getVal('id.hora_nacimiento')} onChange={handleUpdate} />
                                            <InputText label="Edad" type="number" path="id.edad" value={getVal('id.edad')} onChange={handleUpdate} />
                                            <SelectInput label="Sexo" path="id.sexo" options={['Femenino', 'Masculino']} value={getVal('id.sexo')} onChange={handleUpdate} />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                            <SelectInput label="Estado Civil" path="id.estado_civil" options={['Soltero(a)', 'Casado(a)', 'Unión estable', 'Divorciado(a)', 'Viudo(a)']} value={getVal('id.estado_civil')} onChange={handleUpdate} />
                                            <InputText label="Ocupación" path="id.ocupacion" value={getVal('id.ocupacion')} onChange={handleUpdate} />
                                            <InputText label="Lugar de Nacimiento" path="id.lugar_nacimiento" value={getVal('id.lugar_nacimiento')} onChange={handleUpdate} />
                                            <InputText label="Edad en horas/días (si es RN)" path="id.edad_neonatal" placeholder="Ej. 18 horas" value={getVal('id.edad_neonatal')} onChange={handleUpdate} />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <InputText label="Religión" path="id.religion" value={getVal('id.religion')} onChange={handleUpdate} />
                                            <InputText label="Seguro / SSO" path="id.seguro" value={getVal('id.seguro')} onChange={handleUpdate} />
                                        </div>
                                        <InputText label="Dirección Completa" path="id.direccion" value={getVal('id.direccion')} onChange={handleUpdate} />
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <InputText label="Teléfono" path="id.telefono" value={getVal('id.telefono')} onChange={handleUpdate} />
                                            <InputText label="Email" path="id.email" type="email" value={getVal('id.email')} onChange={handleUpdate} />
                                            <InputText label="Fecha Admisión Anterior" type="date" path="id.admision_anterior" value={getVal('id.admision_anterior')} onChange={handleUpdate} />
                                        </div>
                                        <div className="bg-gradient-to-br from-slate-50 to-white shadow-sm ring-1 ring-slate-100 p-5 rounded-xl border border-gray-200 mt-6 shadow-sm">
                                            <h4 className="font-bold text-clinical-800 mb-4 border-b border-gray-200 pb-2">Médico que Elabora la Historia</h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <InputText label="Nombre del médico" path="id.medico_nombre" value={getVal('id.medico_nombre')} onChange={handleUpdate} />
                                                <InputText label="N.º de Colegio / Cédula Profesional (M.P.P.S.)" path="id.medico_cedula" value={getVal('id.medico_cedula')} onChange={handleUpdate} />
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-5 rounded-xl border border-clinical-200 mt-6 shadow-sm">
                                            <h4 className="font-bold text-clinical-800 mb-4 border-b border-clinical-200 pb-2">Representante / Responsable (si el paciente es menor de edad)</h4>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <InputText label="Nombre del padre/madre o responsable" path="id.representante_nombre" value={getVal('id.representante_nombre')} onChange={handleUpdate} />
                                                <InputText label="Parentesco" path="id.representante_parentesco" value={getVal('id.representante_parentesco')} onChange={handleUpdate} />
                                                <InputText label="Cédula" path="id.representante_cedula" value={getVal('id.representante_cedula')} onChange={handleUpdate} />
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-5 rounded-xl border border-clinical-200 mt-6 shadow-sm">
                                            <h4 className="font-bold text-clinical-800 mb-4 border-b border-clinical-200 pb-2">Contacto de Emergencia</h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <InputText label="Avisar a (Nombre)" path="id.emergencia_nombre" value={getVal('id.emergencia_nombre')} onChange={handleUpdate} />
                                                <InputText label="Parentesco y Teléfono" path="id.emergencia_parentesco" value={getVal('id.emergencia_parentesco')} onChange={handleUpdate} />
                                            </div>
                                        </div>
                                        <TextArea label="Información Adicional (a criterio del examinador)" path="id.info_adicional" rows={3} placeholder="Cualquier dato relevante de la identificación o el ingreso que no tenga un campo específico..." value={getVal('id.info_adicional')} onChange={handleUpdate} />
                                    </div>
                                )}

                                {currentStep === 1 && (
                                    <div className="space-y-6">
                                        <TextArea label="Motivo de Ingreso (Síntoma Principal)" path="motivo.texto" rows={3} placeholder="Ej. Dificultad para respirar..." value={getVal('motivo.texto')} onChange={handleUpdate} />
                                        <TextArea label="Enfermedad Actual" path="enfermedad_actual.texto" rows={12} placeholder="Relato conciso y completo de las dolencias, indicando fecha de comienzo, duración y tratamiento..." value={getVal('enfermedad_actual.texto')} onChange={handleUpdate} />
                                        <TextArea label="Diagnóstico Provisional / de Admisión" path="diagnostico.provisional" rows={3} placeholder="Impresión diagnóstica inicial, antes de completar antecedentes y examen físico..." value={getVal('diagnostico.provisional')} onChange={handleUpdate} />
                                    </div>
                                )}

                                {currentStep === 2 && (
                                    <div>
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            Marca <strong>Niega</strong> o <strong>Refiere</strong> para cada antecedente. Si el paciente refiere, agrega el detalle en el campo de al lado.
                                        </p>
                                        <NiegaRefiereGroup title="Antecedentes Personales Patológicos" items={ANTECEDENTES_PATOLOGICOS} basePath="antecedentes_patologicos" formData={formData} onChange={handleUpdate} />
                                        <NiegaRefiereGroup title="Antecedentes Quirúrgicos / Traumáticos / Transfusionales" items={ANTECEDENTES_QUIRURGICOS} basePath="antecedentes_quirurgicos" formData={formData} onChange={handleUpdate} />
                                        <div className="mb-6 bg-gradient-to-br from-slate-50 to-white shadow-sm ring-1 ring-slate-100 p-4 rounded-xl border border-gray-100">
                                            <h3 className="text-base font-bold text-clinical-800 mb-3 flex items-center gap-2 border-b-2 border-clinical-200 pb-1.5">Antecedentes Farmacológicos</h3>
                                            <TextArea label="Medicamentos de uso actual" path="antecedentes_farmacologicos.medicamentos_actuales" rows={3} value={getVal('antecedentes_farmacologicos.medicamentos_actuales')} onChange={handleUpdate} />
                                            <InputText label="Alergias medicamentosas conocidas" path="antecedentes_farmacologicos.alergias_medicamentosas" value={getVal('antecedentes_farmacologicos.alergias_medicamentosas')} onChange={handleUpdate} />
                                        </div>
                                        <StructuredItem title="Esquema de Vacunación" config={VACUNACION_CONFIG} basePath="vacunacion" formData={formData} onChange={handleUpdate} />
                                        <StructuredItem title="Antecedentes Gineco-Obstétricos (si aplica)" config={GINECO_CONFIG} basePath="gineco" formData={formData} onChange={handleUpdate} />
                                        <StructuredItem title="Antecedentes Prenatales y Obstétricos (Pediatría, si aplica)" config={PRENATAL_PACIENTE_CONFIG} basePath="prenatal_paciente" formData={formData} onChange={handleUpdate} />
                                        <StructuredItem title="Periodo Neonatal (Pediatría, si aplica)" config={PERIODO_NEONATAL_CONFIG} basePath="periodo_neonatal" formData={formData} onChange={handleUpdate} />
                                        <StructuredItem title="Alimentación Infantil (Pediatría, si aplica)" config={ALIMENTACION_INFANTIL_CONFIG} basePath="alimentacion_infantil" formData={formData} onChange={handleUpdate} />
                                        <StructuredItem title="Desarrollo Psicomotor (Pediatría, si aplica)" config={DESARROLLO_CONFIG} basePath="desarrollo" formData={formData} onChange={handleUpdate} />
                                    </div>
                                )}

                                {currentStep === 3 && (
                                    <div>
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            Estado de salud o causa de muerte de padres, hermanos, hijos y otros familiares directos.
                                        </p>
                                        <StructuredItem title="Composición Familiar y Estado de Salud" config={FAMILIA_DIRECTA_CONFIG} basePath="familia_directa" formData={formData} onChange={handleUpdate} />
                                        <FamiliaresAdicionales formData={formData} onChange={handleUpdate} />
                                        <NiegaRefiereGroup title="Antecedentes Familiares Patológicos (enfermedades específicas)" items={ANTECEDENTES_FAMILIARES} basePath="antecedentes_familiares" formData={formData} onChange={handleUpdate} familiares={getFamiliaresDisponibles(formData)} />
                                    </div>
                                )}

                                {currentStep === 4 && (
                                    <div>
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            Cada hábito tiene sus propios campos específicos. El texto clínico se genera automáticamente a partir de lo que llenes, y puedes agregar notas adicionales si hace falta.
                                        </p>
                                        {Object.keys(HABITOS_CONFIG).map(key => (
                                            <StructuredItem key={key} title={HABITOS_CONFIG[key].title} config={HABITOS_CONFIG[key]} basePath={`habitos.${key}`} formData={formData} onChange={handleUpdate} />
                                        ))}
                                    </div>
                                )}

                                {currentStep === 5 && (
                                    <div>
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            Vivienda, saneamiento, entorno y factores de riesgo epidemiológico.
                                        </p>
                                        <StructuredItem title="Antecedentes Epidemiológicos y Socioambientales" config={EPIDEMIOLOGICOS_CONFIG} basePath="epidemiologicos" formData={formData} onChange={handleUpdate} />
                                    </div>
                                )}

                                {currentStep === 6 && (
                                    <div>
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            <strong>Instrucciones:</strong> Deje en "Omitir" lo no evaluado. Use "Normal" para autocompletar. Al marcar <strong>"Patológico"</strong> se precargará el texto normal en <span className="text-gray-400 italic">gris claro</span> para que edite solo lo necesario.
                                        </p>
                                        {Object.keys(EXAMEN_FUNCIONAL_TEMPLATE).map(groupKey => (
                                            <SystemGroup key={groupKey} title={groupKey} template={EXAMEN_FUNCIONAL_TEMPLATE[groupKey]} basePath={`examen_funcional.${groupKey}`} formData={formData} onChange={handleUpdate} />
                                        ))}
                                    </div>
                                )}

                                {currentStep === 7 && (
                                    <div className="space-y-6">
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            El <strong>IMC</strong> y el <strong>índice cintura/cadera</strong> se calculan automáticamente al ingresar los valores correspondientes.
                                        </p>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                            <InputText label="T. Arterial (mmHg)" path="vitales.ta" placeholder="120/80" value={getVal('vitales.ta')} onChange={handleUpdate} />
                                            <InputText label="F. Cardíaca (lpm)" path="vitales.fc" type="number" value={getVal('vitales.fc')} onChange={handleUpdate} />
                                            <InputText label="F. Respiratoria (rpm)" path="vitales.fr" type="number" value={getVal('vitales.fr')} onChange={handleUpdate} />
                                            <InputText label="Temperatura (°C)" path="vitales.temp" type="number" value={getVal('vitales.temp')} onChange={handleUpdate} />
                                            <InputText label="Saturación O2 (%)" path="vitales.sat" type="number" value={getVal('vitales.sat')} onChange={handleUpdate} />
                                            <InputText label="Peso (kg)" path="vitales.peso" type="number" value={getVal('vitales.peso')} onChange={handleUpdate} />
                                            <InputText label="Talla (cm)" path="vitales.talla" type="number" value={getVal('vitales.talla')} onChange={handleUpdate} />
                                            <InputText label="IMC (Auto)" path="vitales.imc" type="text" readOnly={true} value={getVal('vitales.imc')} />
                                            <InputText label="Circunf. Cintura (cm)" path="vitales.cintura" type="number" value={getVal('vitales.cintura')} onChange={handleUpdate} />
                                            <InputText label="Circunf. Cadera (cm)" path="vitales.cadera" type="number" value={getVal('vitales.cadera')} onChange={handleUpdate} />
                                            <InputText label="Índice Cintura/Cadera (Auto)" path="vitales.icc" type="text" readOnly={true} value={getVal('vitales.icc')} />
                                            <InputText label="Perímetro Cefálico (cm, Pediatría)" path="vitales.perimetro_cefalico" type="number" value={getVal('vitales.perimetro_cefalico')} onChange={handleUpdate} />
                                            <InputText label="Glicemia capilar (mg/dL)" path="vitales.glicemia" type="number" value={getVal('vitales.glicemia')} onChange={handleUpdate} />
                                            <InputText label="Escala de dolor (0-10)" path="vitales.dolor" type="number" value={getVal('vitales.dolor')} onChange={handleUpdate} />
                                        </div>
                                    </div>
                                )}

                                {currentStep === 8 && (
                                    <div>
                                        <p className="text-sm text-clinical-800 mb-6 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 p-4 rounded-xl border border-clinical-200">
                                            Evaluación clínica segmentaria. La lógica de autocompletado es igual a la del examen funcional.
                                        </p>
                                        {Object.keys(EXAMEN_FISICO_TEMPLATE).map(groupKey => (
                                            <SystemGroup key={groupKey} title={groupKey} template={EXAMEN_FISICO_TEMPLATE[groupKey]} basePath={`examen_fisico.${groupKey}`} formData={formData} onChange={handleUpdate} />
                                        ))}
                                    </div>
                                )}

                                {currentStep === 9 && (
                                    <div className="space-y-6">
                                        <TextArea label="Impresión Diagnóstica (tras antecedentes y examen físico)" path="diagnostico.impresion" rows={5} placeholder="1. ...&#10;2. ..." value={getVal('diagnostico.impresion')} onChange={handleUpdate} />
                                        <TextArea label="Plan / Órdenes Médicas" path="diagnostico.plan" rows={8} value={getVal('diagnostico.plan')} onChange={handleUpdate} />
                                    </div>
                                )}

                                {currentStep === 10 && (
                                    <div className="space-y-6">
                                        <EvolucionTable formData={formData} onChange={handleUpdate} />

                                        <div className="bg-gradient-to-br from-slate-50 to-white shadow-sm ring-1 ring-slate-100 p-4 rounded-xl border border-gray-100">
                                            <h3 className="text-lg font-bold text-clinical-800 mb-4">Egreso</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <SelectInput label="Tipo de egreso" path="egreso.tipo" options={['Curación', 'Mejoría', 'Traslado', 'Egreso contra opinión médica', 'Muerte', 'Otras causas']} value={getVal('egreso.tipo')} onChange={handleUpdate} />
                                                <InputText label="Fecha de egreso" type="date" path="egreso.fecha" value={getVal('egreso.fecha')} onChange={handleUpdate} />
                                                <InputText label="Hora de egreso" type="time" path="egreso.hora" value={getVal('egreso.hora')} onChange={handleUpdate} />
                                            </div>
                                            <TextArea label="Diagnóstico Clínico Final" path="egreso.diagnostico_final" rows={3} value={getVal('egreso.diagnostico_final')} onChange={handleUpdate} />
                                            {getVal('egreso.tipo') === 'Muerte' && (
                                                <div className="bg-white p-4 rounded-xl border border-gray-200 mt-2">
                                                    <SelectInput label="¿Autopsia solicitada?" path="egreso.autopsia" options={['Sí', 'No']} value={getVal('egreso.autopsia')} onChange={handleUpdate} />
                                                </div>
                                            )}
                                        </div>

                                        {getVal('egreso.tipo') === 'Egreso contra opinión médica' && (
                                            <div className="bg-amber-50 p-4 rounded-xl border border-amber-300">
                                                <h3 className="text-lg font-bold text-amber-800 mb-2">Exoneración de Responsabilidad por Egreso</h3>
                                                <p className="text-xs text-amber-700 mb-4">El suscrito certifica que la persona cuyo nombre aparece en esta historia sale del centro de salud contra la opinión de los médicos. Hace constar que, habiendo sido advertido de los riesgos que esto implica, descarga de toda responsabilidad a los médicos tratantes y a la institución por las consecuencias que de ello puedan resultar.</p>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <InputText label="Nombre de quien firma" path="egreso.exoneracion_nombre" value={getVal('egreso.exoneracion_nombre')} onChange={handleUpdate} />
                                                    <InputText label="Cédula" path="egreso.exoneracion_cedula" value={getVal('egreso.exoneracion_cedula')} onChange={handleUpdate} />
                                                    <SelectInput label="Parentesco" path="egreso.exoneracion_parentesco" options={['Paciente', 'Padre/Madre', 'Cónyuge', 'Hijo(a)', 'Otro familiar', 'Representante legal']} value={getVal('egreso.exoneracion_parentesco')} onChange={handleUpdate} />
                                                    <InputText label="Fecha" type="date" path="egreso.exoneracion_fecha" value={getVal('egreso.exoneracion_fecha')} onChange={handleUpdate} />
                                                </div>
                                            </div>
                                        )}

                                        <div className="bg-gradient-to-br from-slate-50 to-white shadow-sm ring-1 ring-slate-100 p-4 rounded-xl border border-gray-100">
                                            <h3 className="text-lg font-bold text-clinical-800 mb-2">Consentimiento / Autorización</h3>
                                            <p className="text-xs text-gray-500 mb-4">El suscrito autoriza al médico o a los médicos encargados del cuidado del paciente a efectuar los exámenes, tratamientos e intervenciones que se consideren necesarios o aconsejables para el diagnóstico y tratamiento del caso.</p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <InputText label="Nombre de quien firma" path="consentimiento.nombre_firma" value={getVal('consentimiento.nombre_firma')} onChange={handleUpdate} />
                                                <InputText label="Cédula" path="consentimiento.cedula_firma" value={getVal('consentimiento.cedula_firma')} onChange={handleUpdate} />
                                                <SelectInput label="Parentesco" path="consentimiento.parentesco" options={['Paciente', 'Padre/Madre', 'Cónyuge', 'Hijo(a)', 'Otro familiar', 'Representante legal']} value={getVal('consentimiento.parentesco')} onChange={handleUpdate} />
                                                <InputText label="Fecha" type="date" path="consentimiento.fecha" value={getVal('consentimiento.fecha')} onChange={handleUpdate} />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="flex justify-between items-center glass-nav p-4 rounded-2xl shadow-lg border border-gray-200/60 fixed bottom-4 left-4 right-4 md:static max-w-4xl mx-auto z-10">
                            <button
                                onClick={() => changeStep(Math.max(0, currentStep - 1))}
                                disabled={currentStep === 0}
                                className={`px-5 py-2.5 rounded-xl font-bold transition-all ${currentStep === 0 ? 'text-gray-300 bg-gradient-to-br from-slate-50 to-white shadow-sm ring-1 ring-slate-100 cursor-not-allowed' : 'text-clinical-700 bg-gradient-to-br from-blue-50/40 to-white shadow-sm ring-1 ring-blue-100/50 hover:bg-clinical-100 border border-clinical-200 hover:shadow-sm'}`}
                            >
                                ← Anterior
                            </button>
                            <span className="text-sm text-gray-500 font-bold bg-gray-100 px-4 py-1.5 rounded-full shadow-inner border border-gray-200">{currentStep + 1} / {SECTIONS.length}</span>
                            {currentStep === SECTIONS.length - 1 ? (
                                <button
                                    onClick={exportWordDocument}
                                    className="px-5 py-2.5 rounded-xl font-bold transition-all text-white bg-gradient-to-r from-clinical-600 to-clinical-700 hover:from-clinical-700 hover:to-clinical-800 shadow-md hover:shadow-lg hover:-translate-y-0.5 flex items-center gap-2"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    Descargar Word
                                </button>
                            ) : (
                                <button
                                    onClick={() => changeStep(Math.min(SECTIONS.length - 1, currentStep + 1))}
                                    className="px-5 py-2.5 rounded-xl font-bold transition-all text-white bg-gradient-to-r from-clinical-500 to-clinical-600 hover:from-clinical-600 hover:to-clinical-700 shadow-md hover:shadow-lg hover:-translate-y-0.5"
                                >
                                    Siguiente →
                                </button>
                            )}
                        </div>
                    </main>
                </div>
                )}

                {confirmAction && (
                    <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-slide-up ring-1 ring-gray-200/50">
                            <h3 className="text-lg font-bold text-gray-800 mb-2">
                                {confirmAction.type === 'clear' ? '¿Vaciar esta historia clínica?' : '¿Eliminar esta historia clínica?'}
                            </h3>
                            <p className="text-sm text-gray-600 mb-6 leading-relaxed">
                                {confirmAction.type === 'clear'
                                    ? 'Se borrarán todos los datos que has llenado en esta historia. Esta acción no se puede deshacer.'
                                    : 'Esta historia se eliminará por completo de este dispositivo, incluyendo su fecha de ingreso y egreso si los tiene. Esta acción no se puede deshacer.'}
                            </p>
                            <div className="flex gap-3 justify-end">
                                <button onClick={() => setConfirmAction(null)} className="px-4 py-2.5 rounded-xl text-gray-600 bg-gray-100 hover:bg-gray-200 font-semibold transition-colors">Cancelar</button>
                                <button onClick={executeConfirm} className="px-4 py-2.5 rounded-xl text-white bg-red-600 hover:bg-red-700 font-semibold shadow-md hover:shadow-lg transition-all">
                                    {confirmAction.type === 'clear' ? 'Sí, vaciar' : 'Sí, eliminar'}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
                .then(registration => {
                    console.log('SW registrado exitosamente con scope: ', registration.scope);
                })
                .catch(err => {
                    console.log('Fallo el registro del SW: ', err);
                });
        });
    }
</script>
</body>
</html>
